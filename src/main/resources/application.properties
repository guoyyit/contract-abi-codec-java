# ---- Contract ABI codec configuration (prefix: codec) ----
# Maximum accepted encoded input / produced calldata size in bytes.
codec.max-input-bytes=1048576
# Maximum supported nesting depth (tuples/arrays). Requests deeper than this fail fast.
codec.max-nesting-depth=32
# Maximum number of resolved type layouts kept in the bounded LRU cache.
codec.layout-cache-capacity=1024
# File used for crash-safe, atomic function-definition persistence.
codec.registry-file=data/registry.json
# Disable to run with an in-memory, non-persistent registry.
codec.persistence-enabled=true

spring.jackson.default-property-inclusion=non_null
